name: CI

on:
  push:
    branches: [main, go-rewrite]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest # Linux minutes are the cheapest; macOS is covered by cross-compiling
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd pkg)" || (gofmt -l cmd pkg; exit 1)
      - run: go vet ./...
      - run: go test ./...
      # The macOS WebKit login window cannot run here, but it must compile.
      - name: vet and build for macOS
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: |
          go vet ./...
          go build -o /dev/null ./cmd/brui
