name: Release check

# Validates .goreleaser.yaml and builds the .deb/.rpm/archives without
# publishing. Runs when the packaging files change, or by hand (Actions tab,
# once this file is on the default branch) before tagging.
on:
  workflow_dispatch:
  push:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release-check.yml

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: Show the .deb dependencies
        run: dpkg-deb -I dist/*.deb | grep -E 'Package|Version|Depends'
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          retention-days: 3
